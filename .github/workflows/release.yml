name: Release

# What a version tag produces: the `inlaysql` CLI, the WASM module, and a
# GitHub Release with both attached and the module's size written down.
#
# The size number already exists — `wasm.yml` computes it on every build — but
# it lives in a job summary that scrolls away. A release is the one place the
# number is worth keeping, so it is published in the release notes.
#
# Built on GitHub-hosted runners: `wasm-bindgen-cli` is only provisioned there
# (see `wasm.yml`), and a release binary built on a known image beats one built
# on whatever a single machine happens to have. `ci.yml` runs on the same
# tag and is what says the code is good; this workflow only packages it.
on:
  push:
    tags:
      - "v*"
  # A tag is not something to test by cutting one. Dispatch builds and uploads
  # the artifacts without creating a release, so the packaging can be checked.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  cli:
    name: CLI binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/rust
        with:
          cache: release

      # `inlaysql` is the binary from `inlaysql-mcp`: the CLI and the MCP
      # server are the same executable.
      - name: Build
        run: cargo build --release -p inlaysql-mcp --bin inlaysql

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(git rev-parse --short HEAD)"
          name="inlaysql-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name"
          cp target/release/inlaysql "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -czf "dist/${name}.tar.gz" -C dist "$name"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          ./target/release/inlaysql --version || true
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: cli
          path: dist/*.tar.gz*
          retention-days: 7

  wasm:
    name: WASM module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
          cache: release-wasm

      # Same version-pinning as `wasm.yml`: the CLI must match the
      # `wasm-bindgen` crate exactly or the glue does not match the module.
      - name: Install wasm-bindgen-cli
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[",]/,""); print $3; exit}' Cargo.lock)"
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"
          if curl --proto '=https' --tlsv1.2 -sSfL "$url" | tar -xz --strip-components=1 -C /usr/local/bin \
               "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen"; then
            echo "installed the prebuilt binary"
          else
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
          wasm-bindgen --version

      - name: Build the module and the demo bundle
        run: ./crates/inlaysql-wasm/build.sh

      # The number `wasm.yml` computes per build, recorded here so the release
      # says how big the thing it ships is.
      - name: Package and measure
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(git rev-parse --short HEAD)"
          name="inlaysql-wasm-${version}"
          mkdir -p dist
          tar -czf "dist/${name}.tar.gz" -C crates/inlaysql-wasm/www pkg
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

          wasm=crates/inlaysql-wasm/www/pkg/inlaysql_wasm_bg.wasm
          raw=$(wc -c < "$wasm")
          gz=$(gzip -c "$wasm" | wc -c)
          {
            echo "| artifact | bytes | KiB | gzipped KiB |"
            echo "| --- | ---: | ---: | ---: |"
            echo "| \`inlaysql_wasm_bg.wasm\` | $raw | $((raw / 1024)) | $((gz / 1024)) |"
          } > dist/size.md
          cat dist/size.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: wasm
          path: |
            dist/*.tar.gz*
            dist/size.md
          retention-days: 7

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [cli, wasm]
    # Dispatch runs stop at the artifacts. Only a tag publishes.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## InlaySQL ${GITHUB_REF_NAME}"
            echo
            echo "### WASM payload"
            echo
            cat dist/size.md
            echo
            echo "Reproduce every number in these notes with the scripts in"
            echo "[TESTING.md](TESTING.md) and \`bench/run.sh\`."
          } > notes.md

          rm -f dist/size.md
          ls -l dist
          gh release create "$GITHUB_REF_NAME" \
            --title "InlaySQL $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
