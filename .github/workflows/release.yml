name: Release

# What a version tag produces: the `inlaysql` CLI, the WASM module, the C-ABI
# shared libraries for the three desktop platforms, and a GitHub Release with
# everything attached, checksummed, and the module's size written down.
#
# The size number already exists — `wasm.yml` computes it on every build — but
# it lives in a job summary that scrolls away. A release is the one place the
# number is worth keeping, so it is published in the release notes.
#
# Built on GitHub-hosted runners: `wasm-bindgen-cli` is only provisioned there
# (see `wasm.yml`), and a release binary built on a known image beats one built
# on whatever a single machine happens to have. `ci.yml` runs on the same
# tag and is what says the code is good; this workflow only packages it.
on:
  push:
    tags:
      - "v*"
  # A tag is not something to test by cutting one. Dispatch builds and uploads
  # the artifacts without creating a release, so the packaging can be checked.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  cli:
    name: CLI binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/rust
        with:
          cache: release

      # `inlaysql` is the binary from `inlaysql-mcp`: the CLI and the MCP
      # server are the same executable.
      - name: Build
        run: cargo build --release -p inlaysql-mcp --bin inlaysql

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(git rev-parse --short HEAD)"
          name="inlaysql-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name"
          cp target/release/inlaysql "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -czf "dist/${name}.tar.gz" -C dist "$name"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          ./target/release/inlaysql --version || true
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: cli
          path: dist/*.tar.gz*
          retention-days: 7

  ffi:
    name: C-ABI library — ${{ matrix.target }}
    # The SQLite-like adapter: one shared library per platform, each a
    # first-class release artifact, because a language binding (PHP FFI,
    # Python ctypes, Ruby FFI, .NET P/Invoke) can do nothing without the
    # binary matching its OS and architecture.
    #
    # Two targets, because the engine's file layer is Unix-only today:
    # `FileDevice` is built on `pread`/`pwrite`, advisory `flock` and
    # `stat`'s `dev`/`ino` (see `crates/inlaysql/src/device.rs`), none of
    # which Windows maps to without a port that has never been written or
    # tested — CI has never carried a Windows job for exactly this reason.
    # Shipping a Windows DLL would be shipping a build nobody has ever run.
    # When the port lands, adding the target is a matrix row and a
    # `rustup target` line.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: libinlaysql_ffi.dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libinlaysql_ffi.so
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.target }}
          cache: release-ffi-${{ matrix.target }}

      - name: Build
        run: cargo build --release -p inlaysql-ffi --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(git rev-parse --short HEAD)"
          name="inlaysql-ffi-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "dist/$name/"
          cp crates/inlaysql-ffi/include/inlaysql.h "dist/$name/"
          cp LICENSE "dist/$name/"
          # The wrappers are what a PHP/Python/Ruby/C#/Java developer actually
          # requires — one file each, and every language can use every one,
          # so all of them ship in every archive regardless of target.
          cp -R crates/inlaysql-ffi/wrappers "dist/$name/wrappers"
          tar -czf "dist/${name}.tar.gz" -C dist "$name"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: ffi-${{ matrix.target }}
          path: dist/*.tar.gz*
          retention-days: 7

  wasm:
    name: WASM module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
          cache: release-wasm

      # Same version-pinning as `wasm.yml`: the CLI must match the
      # `wasm-bindgen` crate exactly or the glue does not match the module.
      - name: Install wasm-bindgen-cli
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[",]/,""); print $3; exit}' Cargo.lock)"
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"
          if curl --proto '=https' --tlsv1.2 -sSfL "$url" | tar -xz --strip-components=1 -C /usr/local/bin \
               "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen"; then
            echo "installed the prebuilt binary"
          else
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
          wasm-bindgen --version

      - name: Build the module and the demo bundle
        run: ./crates/inlaysql-wasm/build.sh

      # The number `wasm.yml` computes per build, recorded here so the release
      # says how big the thing it ships is.
      - name: Package and measure
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(git rev-parse --short HEAD)"
          name="inlaysql-wasm-${version}"
          mkdir -p dist
          tar -czf "dist/${name}.tar.gz" -C crates/inlaysql-wasm/www pkg
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

          wasm=crates/inlaysql-wasm/www/pkg/inlaysql_wasm_bg.wasm
          raw=$(wc -c < "$wasm")
          gz=$(gzip -c "$wasm" | wc -c)
          {
            echo "| artifact | bytes | KiB | gzipped KiB |"
            echo "| --- | ---: | ---: | ---: |"
            echo "| \`inlaysql_wasm_bg.wasm\` | $raw | $((raw / 1024)) | $((gz / 1024)) |"
          } > dist/size.md
          cat dist/size.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: wasm
          path: |
            dist/*.tar.gz*
            dist/size.md
          retention-days: 7

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [cli, ffi, wasm]
    # Dispatch runs stop at the artifacts. Only a tag publishes.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## InlaySQL ${GITHUB_REF_NAME}"
            echo
            echo "The engine, three ways: the \`inlaysql\` CLI (and MCP server),"
            echo "the WASM module for JavaScript, and the C-ABI shared libraries"
            echo "any FFI language can load in-process — the SQLite-like shape,"
            echo "no server."
            echo
            echo "### Artifacts"
            echo
            echo "| file | what it is |"
            echo "| --- | --- |"
            echo "| \`inlaysql-${version}-x86_64-unknown-linux-gnu.tar.gz\` | the CLI + MCP server (Linux) |"
            echo "| \`inlaysql-ffi-${version}-aarch64-apple-darwin.tar.gz\` | C-ABI library (macOS, Apple silicon) |"
            echo "| \`inlaysql-ffi-${version}-x86_64-unknown-linux-gnu.tar.gz\` | C-ABI library (Linux) |"
            echo "| \`inlaysql-wasm-${version}.tar.gz\` | WASM module + the JS glue |"
            echo
            echo "Each \`.tar.gz\` ships beside a \`.sha256\`; verify with"
            echo "\`sha256sum -c <file>.sha256\`."
            echo
            echo "**No Windows build:** the file layer is Unix-only today"
            echo "(\`pread\`/\`pwrite\`, advisory locks) — a Windows port has not"
            echo "been written. The WASM module runs anywhere a browser or"
            echo "Node does, Windows included."
            echo
            echo "### Using the C-ABI libraries"
            echo
            echo "Each FFI archive carries the \`${version}\` library, the"
            echo "\`inlaysql.h\` header, and the **wrappers/** directory — a"
            echo "one-file class per language (\`inlaysql.php\`, \`inlaysql.py\`,"
            echo "\`inlaysql.rb\`, \`InlaySQL.cs\`, \`InlaySQL.java\`), each the whole"
            echo "binding for its language. Copy the one you need and open the"
            echo "file like SQLite; the quickest introduction, with copy-paste"
            echo "quickstarts for all five, is"
            echo "[docs/clients.md](https://github.com/inlaySQL/inlaysql/blob/main/docs/clients.md)."
            echo
            echo "### WASM payload"
            echo
            cat dist/size.md
            echo
            echo "### Status: beta"
            echo
            echo "The on-disk format is **pre-1.0 — recreate, not migrate**: a"
            echo "database written by this version may not open in a later one."
            echo "The MySQL server mode is plaintext and localhost-first unless"
            echo "you configure TLS. Read"
            echo "[What this is not](https://github.com/inlaySQL/inlaysql#what-this-is-not)"
            echo "before relying on this for anything real."
            echo
            echo "Reproduce every number in these notes with the scripts in"
            echo "[TESTING.md](TESTING.md) and \`bench/run.sh\`."
          } > notes.md

          ls -l dist
          gh release create "$GITHUB_REF_NAME" \
            --title "InlaySQL $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
