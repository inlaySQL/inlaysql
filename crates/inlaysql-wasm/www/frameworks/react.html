<!doctype html>
<!-- React without a bundler: an import map resolves `react` and
     `react-dom/client` from esm.sh. Without a bundler there is no JSX, so
     the tree is spelled `React.createElement` — the structure is exactly
     what a Vite/CRA app writes as JSX — initialise the engine in
     `useEffect`, keep the database behind the module-level promise, render
     query results from state. Swap the import map for
     `npm install inlaysql-wasm` and a bundler alias when the app grows one;
     the component's shape does not change. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>InlaySQL — with React</title>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 1.5rem; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid #ccc; padding: .2rem .5rem; text-align: left; }
  .ok { color: #0a7d38; }
  .err { color: #b42318; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useEffect, useRef, useState } from "react";
    import { createRoot } from "react-dom/client";
    import init, { Database } from "../pkg/inlaysql_wasm.js";

    // The module initialises once per page; every component awaits the same
    // promise. This is the piece a bundler-based app usually hides in a
    // `wasmLoader.ts` — it is small enough to just be seen here.
    const engine = (async () => {
      await init();
      const db = new Database();
      db.execute("CREATE TABLE docs (id INTEGER PRIMARY KEY, body TEXT)", null);
      db.execute(
        "INSERT INTO docs (id, body) VALUES (?, ?), (?, ?), (?, ?)",
        JSON.stringify([
          1, "an embedded database written in rust",
          2, "search that lives in sql",
          3, "one file, no server",
        ]),
      );
      return db;
    })();

    function App() {
      const [rows, setRows] = useState(null);
      const [status, setStatus] = useState("loading");
      const dbRef = useRef(null);

      useEffect(() => {
        engine.then((db) => {
          dbRef.current = db;
          setRows(JSON.parse(
            db.query("SELECT id, body FROM docs WHERE body LIKE ? ORDER BY id",
              JSON.stringify(["%rust%"])),
          ).rows);
          setStatus("ok");
        }).catch((error) => setStatus(`error: ${error}`));
      }, []);

      if (status === "loading") {
        return React.createElement("p", { "data-status": "loading" }, "loading…");
      }
      if (status !== "ok") {
        return React.createElement("p", { className: "err", "data-status": "error" }, status);
      }

      return React.createElement(
        "div",
        null,
        React.createElement("p", { className: "ok", "data-status": "ok" },
          `${rows.length} row(s) via React`),
        React.createElement("table", null,
          React.createElement("tbody", null,
            rows.map(([id, body]) =>
              React.createElement("tr", { key: id },
                React.createElement("td", null, id),
                React.createElement("td", null, body))))),
      );
    }

    createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
