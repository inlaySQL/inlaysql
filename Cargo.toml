[workspace]
resolver = "2"
# cargo-fuzz needs nightly and its own dependency tree, so it is built on its
# own. `tests/fuzz_smoke.rs` runs the same target bodies on stable so they
# cannot rot between fuzzing runs.
exclude = ["fuzz"]
members = [
    "crates/inlaysql-core",
    "crates/inlaysql",
    "crates/inlaysql-uring",
    "crates/inlaysql-ffi",
    "crates/inlaysql-mcp",
    "crates/inlaysql-server",
    "crates/inlaysql-wasm",
    "crates/inlaysql-bench",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Dual licensed: AGPL-3.0-only, or a commercial licence from Solution Forest
# Limited (`LICENSE-COMMERCIAL.md`). This field carries only the AGPL because
# "commercial" is not an SPDX identifier and crates.io validates against SPDX —
# stating the open-source half here and the alternative in the repository is the
# convention other dual-licensed crates follow.
#
# `-only`, not `-or-later`: dual licensing depends on knowing exactly which
# terms the free half grants, and `-or-later` would hand that choice to whatever
# a future AGPL says. Changing this is a deliberate decision, not a bump.
license = "AGPL-3.0-only"
repository = "https://github.com/inlaySQL/inlaysql"
rust-version = "1.89"

[workspace.dependencies]
inlaysql-core = { path = "crates/inlaysql-core", version = "0.0.1" }
inlaysql = { path = "crates/inlaysql", version = "0.0.1" }
inlaysql-uring = { path = "crates/inlaysql-uring", version = "0.0.1" }
inlaysql-mcp = { path = "crates/inlaysql-mcp", version = "0.0.1" }
inlaysql-server = { path = "crates/inlaysql-server", version = "0.0.1" }

# Core (no_std) dependencies.
sqlparser = { version = "0.62", default-features = false }
libm = "0.2"

# Engine (std) dependencies. None of these may be pulled into inlaysql-core.
redb = "4.1"
io-uring = "0.7"
serde_json = "1"

# TLS for the MySQL wire (`inlaysql-server`). `ring` rather than the default
# `aws-lc-rs` provider: it is the smaller build (no cmake) and the longer
# -established of the two, and this crate's whole dependency surface was one
# entry before TLS, so the one being added is chosen deliberately.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
rustls-pemfile = "2"
# Already in the tree as rustls's crypto provider; taken as a direct dependency
# so `inlaysql-server` can use its PBKDF2 for password storage rather than
# hand-rolling a key-derivation function beside the hand-rolled SHA-1/SHA-256
# the wire protocol's own challenge-response requires.
ring = "0.17"
# Test-only: generates the self-signed certificate the TLS wire tests serve, so
# no private key is committed to this repository.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

# `Durability::Normal`'s barrier (`crates/inlaysql/src/device.rs`): plain
# `fsync(2)` on macOS, `fdatasync` on Linux. `std::fs::File::sync_data()` is
# *not* a weaker barrier than `sync_all()` on macOS — measured directly (both
# ~3-4ms, matching `F_FULLFSYNC`) — so this needs the raw syscall on that
# platform, and `rustix` is used on both for one implementation to reason
# about rather than trusting an unverified per-platform std mapping on
# either. `inlaysql` is `#![forbid(unsafe_code)]`; `rustix` wraps the syscall
# in a safe function so that guarantee stays intact rather than needing a
# second crate like `inlaysql-uring` just to hold one FFI call.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

# WASM build. Never a dependency of a native crate.
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"

# Benchmark-only. Never a dependency of a shipped crate.
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1.6"

# The WASM build is shipped over the network, so it is optimised for size
# rather than speed. Kept separate from `release` so the benchmarks, which are
# optimised for speed, are not quietly measured under different flags.
[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
