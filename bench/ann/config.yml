# InlaySQL's `ann-benchmarks` algorithm definition.
#
# Copy this directory to `ann_benchmarks/algorithms/inlaysql/` in an
# `ann-benchmarks` checkout — see bench/README.md. `definitions.py` imports
# `<module>.module` and calls `<constructor>(*base_args, arg_group)`.
#
# `float/any` and not `float/angular` or `float/euclidean`: the engine answers
# both (the constructor maps the dataset's metric onto the operator class the
# `CREATE INDEX` writes), and refuses any other one outright — so a `hamming`
# dataset fails loudly with the reason instead of being quietly skipped by a
# missing config key.
float:
  any:
    - base_args: ['@metric']
      constructor: InlaySQL
      disabled: false
      docker_tag: ann-benchmarks-inlaysql
      module: ann_benchmarks.algorithms.inlaysql
      name: inlaysql
      run_groups:
        # InlaySQL exposes no `m` and no `ef_construction` in SQL, so there is
        # no graph-shape grid to sweep — unlike pgvector, whose config varies
        # `M` here. Those two shape the stored graph, so surfacing them needs a
        # catalog format change to record them per index. The one build-time
        # knob the SQL surface has is the column type: exact `VECTOR(d)`
        # against quantised `VECTOR(d, INT8)`.
        exact:
          arg_groups: [{quantization: 'exact'}]
          args: {}
          # `SET inlaysql_hnsw_ef_search` — the candidate list the graph walk
          # holds, which is the same dial pgvector's config sweeps as
          # `hnsw.ef_search`, at the same values, so the two curves are sampled
          # at the same operating points.
          #
          # Every value must be at least the run's `--count`: a beam narrower
          # than the answer cannot hold it, and this engine refuses that query
          # rather than returning a short list. Ten is ann-benchmarks' default
          # count; raise the floor with it if you run at a larger one.
          query_args: [[10, 20, 40, 80, 120, 200, 400, 800]]
        int8:
          arg_groups: [{quantization: 'int8'}]
          args: {}
          query_args: [[10, 20, 40, 80, 120, 200, 400, 800]]
