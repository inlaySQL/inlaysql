[package]
name = "inlaysql"
description = "Embedded, serverless SQL database with first-class vector + BM25 hybrid retrieval."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
inlaysql-core = { workspace = true }
redb = { workspace = true }

# SQLite as an oracle for `tests/differential.rs` — a second implementation to
# disagree with, which is the only way to catch a logic bug that a metamorphic
# property does not cover. A dev-dependency: it never reaches a consumer, and
# it does not appear in `inlaysql-core`'s tree, which CI checks.
[dev-dependencies]
rusqlite = { workspace = true }

# The io_uring backend is only exercised in tests here: production code reaches
# it through `Database::open_on`, so the dependency never reaches a consumer of
# this crate who does not want it.
[target.'cfg(target_os = "linux")'.dev-dependencies]
inlaysql-uring = { workspace = true }
